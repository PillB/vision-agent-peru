name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Static analysis and contract tests
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contracts
          npm run test:models

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Visible-UI browser matrix
        run: npm run test:e2e

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove API routes (incompatible with static export)
        run: rm -rf src/app/api

      - name: Build static export
        env:
          GITHUB_ACTIONS: 'true'
          DEPLOY_TARGET: 'github-pages'
        run: npx next build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed visible surface
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test tests/e2e/production-smoke.spec.ts --project=chromium-desktop

      - name: Upload deployment verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
